general {
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Imagens/Wallpapers/current.jpg
    blur_passes = 4
    blur_size = 7
}

animations {
    enabled = true
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date '+%H:%M')</b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, -5%
    halign = center
    valign = top
    shadow_passes = 5
    shadow_size = 3
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -15%
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 2
}

input-field {
    monitor =
    size = 18%, 48
    position = 0, 12%
    halign = center
    valign = bottom

    inner_color = rgba(255, 255, 255, 0.12)
    outer_color = rgba(255, 255, 255, 0.35)
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(255, 255, 255, 1.0)

    placeholder_text = Password
    
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 14
    shadow_passes = 3
    shadow_size = 3
    fade_on_empty = true
}
